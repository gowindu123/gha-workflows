name: Understanding the Job and Step Outputs
on:
  workflow_dispatch:  
jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      job_output: ${{ steps.step1.outputs.step_output }}
    steps:
      - name: Step 1 - Set Output
        id: step1
        run: |
          echo "Setting output value..."
          echo "step_output=Hello from Step 1" >> $GITHUB_ENV
          echo "step_output=Hello from Step 1" >> $GITHUB_OUTPUT

      - name: Step 2 - Use Output
        run: |
          echo "Using output from Step 1..."
          echo "Output from Step 1: ${{ steps.step1.outputs.step_output }}"
          echo "Output from Step 1 (from env): $step_output"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Step 1 - Access Job Output
        run: |
          echo "Accessing output from Job 1..."
          echo "Output from Job 1: ${{ needs.job1.outputs.job_output }}"    
             