name: Docker - Build and Push
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
jobs:
  collect-metadata:
    runs-on: ubuntu-22.04
    steps:
      - name: print runner name
        run: echo "The runner is $RUNNER_NAME"
      - name: print the action
        run: echo "I am triggerd by ${{ github.event_name}}"
        
  build-and-push:
    runs-on: ubuntu-latest
    needs: collect-metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: print working directory
        run: pwd

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./project-files/Dockerfile
          push: true
          tags: govindudev/gha-app:latest

      - name: Run Container
        run: docker run -d -p 5000:5000 --name my-flask-container govindudev/gha-app:latest

      - name: Smoke Test
        run: |
          sleep 5
          curl http://localhost:5000
